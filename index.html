<script>
/* Совместимый адаптер собственного сервера вместо закрытого Claude runtime. */
const officeToken=localStorage.getItem('office_token')||prompt('Ключ доступа к Офису агентов (если ключ не настроен — оставьте пустым)')||'';
if(officeToken)localStorage.setItem('office_token',officeToken);
async function officeApi(url,opts={}){
  const res=await fetch(url,{...opts,headers:{'Authorization':'Bearer '+officeToken,...opts.headers}});
  if(!res.ok)throw Error('HTTP '+res.status);
  return res.headers.get('content-type')?.includes('json')?res.json():res.blob();
}
function collection(bucket){
  const doc=id=>({set:body=>officeApi('/api/'+bucket+'/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),update:body=>officeApi('/api/'+bucket+'/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),delete:()=>officeApi('/api/'+bucket+'/'+encodeURIComponent(id),{method:'DELETE'}),onSnapshot:callback=>pollDoc(bucket,id,callback)});
  return {doc,onSnapshot:callback=>pollList(bucket,callback),orderBy:()=>({limit:()=>({onSnapshot:callback=>pollList(bucket,callback)})})};
}
function pollList(bucket,callback){
  const refresh=async()=>{try{const rows=await officeApi('/api/'+bucket);callback({docs:rows.map(row=>({id:row.id,data:()=>row}))})}catch(e){}};
  refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
}
function pollDoc(bucket,id,callback){
  const refresh=async()=>{try{const rows=await officeApi('/api/'+bucket);const row=rows.find(x=>x.id===id);callback({data:()=>row||null})}catch(e){}};
  refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
}
window.claude={use:async name=>{
 if(name==='db')return {collection,doc:path=>{const [bucket,id]=path.split('/');return collection(bucket).doc(id)}};
 if(name==='mcp')return {callTool:async()=>officeApi('/api/run',{method:'POST'})};
 if(name==='downloads')return {save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}};
 throw Error('Сервис не подключён: '+name);
}};
</script>

async function sendRequest(kind,extra){
  if(!db){toast("База недоступна в этом просмотре");return}
  const id="r"+Date.now();const doc={kind,status:"queued",created_at:new Date().toISOString(),...extra};
  try{await db.collection("requests").doc(id).set(doc)}catch(e){toast("Не удалось создать запрос: нет прав или нет связи");return}
  const trig=meta.trigger_id||'local';
  if(!mcp||!trig){toast("Запрос поставлен в очередь — агент выполнит его при ближайшем прогоне");return}
  const text=`Запрос со страницы: ${RK[kind]}${extra.address?" — адрес: "+extra.address:""}${extra.note?" — уточнение: "+extra.note:""} (requests/${id}).`;
  try{const result=await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:trig,text});toast("Поиск завершён. Новых объектов: "+result.new)}
  catch(e){const c=e&&e.code;
    toast(c==="approval_required"||c==="not_in_manifest"||c==="consent_required"?"Нужно разрешить запуск агента — запрос пока в очереди":

  if(t.id==="usSave"){if(!db){toast("База недоступна в этом просмотре");return}const on=document.querySelector("#usb .on");
    try{await db.collection("objects").doc(openId).update({user_status:on?on.dataset.us:null,user_note:$("#unote").value.trim(),user_at:new Date().toISOString()});toast("Сохранено")}catch(err){toast("Не удалось сохранить: нет прав или нет связи")}return}
  if(t.id==="negCopy"){const el=$("#negMsg");try{await navigator.clipboard.writeText(el.value);toast("Скопировано")}catch(err){el.focus();el.select();toast("Текст выделен, скопируйте его")}return}
  if(t.id==="negSave"){if(!db){toast("База недоступна в этом просмотре");return}const o=objects.find(x=>x.id===openId);if(!o||!o.negotiation)return;
    try{await db.collection("objects").doc(openId).update({negotiation:{...o.negotiation,message:$("#negMsg").value,edited_by_user:true,updated:new Date().toISOString().slice(0,10)}});toast("Текст сохранён")}catch(err){toast("Не удалось сохранить: нет прав или нет связи")}return}
  if(t.dataset.dl){dl(reports.find(x=>x.id===t.dataset.dl));return}
  if(t.id==="upBtn"){$("#upFile").click();return}
  if(t.id==="feedAdd"){
    const name=$("#feedName").value.trim(),url=$("#feedUrl").value.trim();
    if(!name||!/^https:\/\/[^\s]+$/i.test(url)){toast("Укажите название и HTTPS-ссылку на RSS");return}
    try{await db.collection("sources").doc("feed"+Date.now()).set({name,url,status:"ok",kind:"RSS/Atom",found:0});toast("Источник добавлен");tab="sources";render()}catch(e){toast("Не удалось сохранить источник")}
    return}
  if(t.dataset.src){if(!db)return;try{await db.collection("sources").doc(t.dataset.src).update({status:t.dataset.to,status_at:new Date().toISOString()});toast("Статус изменён")}catch(err){toast("Нет прав на изменение")}return}
  if(t.id==="rqRefresh"){sendRequest("refresh",{});return}
  if(t.id==="rqMore"){sendRequest("more",{});return}
  if(t.id==="wAdd"){const a=$("#wAddr").value.trim();if(!a){toast("Введите адрес");return}const note=$("#wNote").value.trim();const wid="w"+Date.now();
    try{await db.collection("watch").doc(wid).set({address:a,note,created_at:new Date().toISOString()})}catch(err){toast("Не удалось сохранить адрес");return}
    $("#wAddr").value="";$("#wNote").value="";sendRequest("watch",{address:a,watch_id:wid,...(note?{note}:{})});return}
  const armed=b=>{if(b.dataset.armed)return true;b.dataset.armed="1";const old=b.textContent;b.textContent="Точно удалить?";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=old}},4000);return false};
  if(t.dataset.oarch||t.dataset.ounarch){const id=t.dataset.oarch||t.dataset.ounarch;try{await db.collection("objects").doc(id).update({archived:!!t.dataset.oarch});if(t.dataset.oarch){openId=null;render()}toast(t.dataset.oarch?"Объект в архиве":"Объект возвращён")}catch(err){toast("Не удалось: нет прав или нет связи")}return}
  if(t.dataset.odel){if(!armed(t))return;const id=t.dataset.odel;const o=[...objects,...archived].find(x=>x.id===id);
    try{if(o)await db.collection("deleted").doc(id).set({address:o.address||"",area:o.area??null,urls:ls(o).map(l=>l.url).filter(Boolean),deleted_at:new Date().toISOString()});await db.collection("objects").doc(id).delete();openId=null;render();toast("Объект удалён")}catch(err){toast("Не удалось удалить")}return}
  if(t.dataset.odelall){if(!armed(t))return;const ids=t.dataset.odelall.split(",");let n=0;
    for(const id of ids){const o=objects.find(x=>x.id===id);try{if(o)await db.collection("deleted").doc(id).set({address:o.address||"",area:o.area??null,urls:ls(o).map(l=>l.url).filter(Boolean),deleted_at:new Date().toISOString()});await db.collection("objects").doc(id).delete();n++}catch(err){}}
    toast("Удалено: "+n);return}
  if(t.dataset.rarch||t.dataset.runarch){const id=t.dataset.rarch||t.dataset.runarch;try{await db.collection("reports").doc(id).update({archived:!!t.dataset.rarch});toast(t.dataset.rarch?"Отчёт в архиве":"Отчёт возвращён")}catch(err){toast("Не удалось: нет прав или нет связи")}return}
  if(t.dataset.rdel){if(!armed(t))return;const r=reports.find(x=>x.id===t.dataset.rdel);
    try{await db.collection("reports").doc(r.id).delete();if(r.asset_id&&assets){try{await assets.delete(r.asset_id)}catch(e){}}toast("Отчёт удалён")}catch(err){toast("Не удалось удалить")}return}
  if(t.dataset.wsave){const a=$("#weAddr").value.trim();if(!a){toast("Адрес не может быть пустым");return}
    try{await db.collection("watch").doc(t.dataset.wsave).update({address:a,note:$("#weNote").value.trim()});toast("Сохранено")}catch(err){toast("Не удалось сохранить")}return}
  if(t.dataset.wcheck){const w=watch.find(x=>x.id===t.dataset.wcheck);if(w)sendRequest("watch",{address:w.address,watch_id:w.id,...(w.note?{note:w.note}:{})});return}
  if(t.dataset.wdel){try{await db.collection("watch").doc(t.dataset.wdel).delete();openWatch=null;render();toast("Адрес снят с контроля")}catch(err){toast("Не удалось убрать адрес")}return}
  if(t.id==="officeRun"){
    t.disabled=true;t.textContent='Поиск запущен…';
    try{const result=await officeApi('/api/run',{method:'POST'});toast('Новых объектов: '+result.new+'. Отчёт создан.')}catch(e){toast('Поиск не запустился: '+e.message)}
    render();return}
  if(t.dataset.agent){openAgentId=t.dataset.agent;render();scrollTo(0,0);return}
  if(t.id==="chatSend"){ask(AGENTS.find(a=>a.id===openAgentId));return}});
$("#view").addEventListener("change",async e=>{if(e.target.id!=="upFile")return;const f=e.target.files[0];e.target.value="";if(!f)return;
  const ext=(f.name.split(".").pop()||"").toLowerCase();const type=ext==="pdf"?"application/pdf":ext==="csv"?"text/csv":null;
  if(!type){toast("Можно загрузить PDF или CSV");return}$("#upNote").textContent="Загружаю…";
  try{const up=await assets.upload(f,{type});await db.collection("reports").doc("u"+Date.now()).set({title:f.name.replace(/\.[^.]+$/,""),filename:f.name,date:new Date().toISOString(),kind:"upload",asset_id:up.id});toast("Загружено: "+f.name)}
  catch(err){$("#upNote").textContent=err&&err.code==="too_large"?"Файл больше 20 МБ":"Не удалось загрузить файл"}});
document.querySelectorAll("nav [data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;openId=null;openAgentId=null;openWatch=null;sub=null;F.only=null;try{localStorage.setItem("tab",tab)}catch(e){}render();scrollTo(0,0)});
document.getElementById("navTeam").innerHTML=AGENTS.map(a=>`<button type="button" data-side-agent="${a.id}" aria-pressed="false"><span class="nav-avatar" aria-hidden="true">${a.name[0]}</span><span class="nav-agent-copy">${a.name}<small>${a.soon?"Скоро":a.role}</small></span><span class="nav-agent-state" aria-hidden="true"></span></button>`).join("");
document.getElementById("navTeam").addEventListener("click",e=>{
 const button=e.target.closest("[data-side-agent]");if(!button)return;
 tab="team";openAgentId=button.dataset.sideAgent;openId=null;openWatch=null;sub=null;F.only=null;
 try{localStorage.setItem("tab",tab)}catch(e){}
 render();scrollTo(0,0);
});
try{const s=localStorage.getItem("tab");if(s&&["objects","reports","sources","stats","team"].includes(s))tab=s}catch(e){}
render();

(async()=>{
  try{sample=await claude.use("sample")}catch(e){}
  try{assets=await claude.use("assets")}catch(e){}
  try{downloads=await claude.use("downloads")}catch(e){}
  try{mcp=await claude.use("mcp")}catch(e){}
  try{db=await claude.use("db")}catch(e){}
  if(!db){loaded=true;$("#lastRun").textContent="База недоступна в этом просмотре";render();return}
  const t=setTimeout(()=>{if(!loaded){loaded=true;$("#lastRun").textContent="База не отвечает, обновите страницу позже";render()}},10000);
  const isTorgi=o=>/торги|tbankrot|cdtrf|efrsb|fedresurs|torgi\.gov/i.test((o.source||"")+" "+(o.url||""));
  db.collection("objects").onSnapshot(s=>{clearTimeout(t);loaded=true;
    const all=s.docs.map(d=>({id:d.id,...d.data()})).filter(o=>!isTorgi(o)&&o.type!=="Квартира");archived=all.filter(o=>o.archived);objects=all.filter(o=>!o.archived);
    let n=0;[o=>!isShare(o)&&!stop(o),o=>isShare(o)&&!stop(o),stop].forEach(fn=>sortObjs(objects.filter(fn)).forEach(o=>{o.no=o.no||++n}));
    if(tab!=="team")render()},()=>{clearTimeout(t);loaded=true;render()});
  db.collection("sources").onSnapshot(s=>{sources=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="sources")render()});
  db.collection("reports").onSnapshot(s=>{reports=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="reports")render()});
  db.collection("agents").onSnapshot(s=>{agents={};s.docs.forEach(d=>agents[d.id]=d.data());syncSidebar();if(tab==="team"&&!openAgentId)syncOffice()});
  db.collection("log").orderBy("ts","desc").limit(80).onSnapshot(s=>{logs=s.docs.map(d=>d.data());if(tab==="team"&&!openAgentId)render()});
  db.doc("meta/run").onSnapshot(d=>{const m=d.data&&d.data();meta=m||{};if(m&&m.last)$("#lastRun").textContent="Последний прогон: "+dt(m.last)});
  db.collection("watch").onSnapshot(s=>{watch=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="objects"&&!openId)render()});
  db.collection("requests").onSnapshot(s=>{requests=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="objects"&&!openId)render()});
})();
</script>

</body></html>
